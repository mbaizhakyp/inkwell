# .github/workflows/ci.yml
#
# The generic CI steps applied in full: checkout, set up environment,
# install dependencies, build, test, report — for every layer of Inkwell's
# testing pyramid (Lectures 12-14).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Per-pull-request CI (gating the merge decision, per Lecture 17's GitHub
  # Flow) plus a push-to-main safety check.

permissions:
  contents: read
  # Every job may read the code and nothing more, unless a job asks for
  # more itself (see the last job).

jobs:
  dependency-audit:
    # The security check that already guards main, now covering the client too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit server dependencies
        run: npm audit --audit-level=high
        working-directory: server
      - name: Audit client dependencies
        run: npm audit --audit-level=high
        working-directory: client

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
      # Set once for the whole job: every Prisma command loads
      # prisma7.config.ts, which needs DATABASE_URL, and the tests use it
      # to reach the database above.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up environment
        uses: actions/setup-node@v5
        with:
          node-version: "22" # matches server/package.json engines (Lecture 10)
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci
        # The postinstall hook (Lecture 14) runs `prisma generate` here.

      - name: Apply database migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Write the throwaway test environment
        working-directory: server
        run: |
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'ACCESS_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'REFRESH_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'LOG_LEVEL=silent\n'
          } > .env.test
        # "npm test" loads .env.test (--env-file), which is never committed,
        # and TokenService refuses to start without JWT secrets (Lecture 16,
        # A02). Fresh random secrets each run: nothing secret is stored here.

      - name: Run tests with coverage # Lecture 12 unit + Lecture 13 integration
        working-directory: server
        run: npm test -- --coverage
        # "npm test" keeps the --experimental-vm-modules flag this project's
        # ES modules need; everything after "--" is passed on to Jest.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: server/coverage/

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx vitest run # Lecture 13's React Testing Library suite
      - working-directory: client
        run: npm run build # the production bundle still builds

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    # "Cheap when caught early": the slowest layer only runs after the fast
    # layers pass, so an obviously broken change fails fast.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies (Playwright, server, client)
        # playwright.config.js starts the real server and client with
        # "npm run dev", so both need their own dependencies installed.
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Prepare the server and its database
        working-directory: server
        run: |
          npx prisma migrate deploy
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'ACCESS_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'REFRESH_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
          } > .env
        # The server's "dev" script loads .env (--env-file=.env), which is
        # never committed. CI writes a throwaway one: the test database's URL
        # plus fresh JWT secrets (the server won't start without them).

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests # Lecture 14's E2E + accessibility suites
        run: npx playwright test --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/

  prepare-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [dependency-audit, server-tests, client-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # "Preparing for deployment": build and tag the image, but do NOT deploy
    # it. Deployment is Lecture 21's separate concern (Continuous Delivery).
    permissions:
      contents: read # checkout still needs to read the code
      packages: write # push to GitHub Container Registry (GHCR)
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is provided automatically by Actions: no manual
          # credential setup needed to push to your own account's registry.
      - name: Build, tag and push the image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inkwell-server:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
        # ${VAR,,} lowercases the owner name: image names must be lowercase.
        # This exact image is what Lecture 21's CD workflow will retrieve and
        # deploy: pushed once, by tag, never rebuilt downstream.
